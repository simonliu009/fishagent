name: fishagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fishagent
      POSTGRES_USER: fishagent
      POSTGRES_PASSWORD: fishagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fishagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishagent -d fishagent"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - fishagent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: fishagent
      MINIO_ROOT_PASSWORD: fishagent-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - fishagent-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fishagent-postgres:
  fishagent-redis:
  fishagent-minio:

name: fishagent

services:
  migrate:
    build: .
    environment: &fishagent-migrate-env
      PYTHONPATH: /app/src
      FISHAGENT_DATABASE_URL: postgresql://fishagent:fishagent@postgres:5432/fishagent
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]

  web:
    build: .
    environment:
      PYTHONPATH: /app/src
      FISHAGENT_HOST: 0.0.0.0
      FISHAGENT_PORT: 3008
      FISHAGENT_PUBLIC_PORT: 3001
      FISHAGENT_DATABASE_URL: postgresql://fishagent:fishagent@postgres:5432/fishagent
      FISHAGENT_REDIS_URL: redis://redis:6379/0
      FISHAGENT_CELERY_BROKER_URL: redis://redis:6379/1
      FISHAGENT_CELERY_RESULT_BACKEND: redis://redis:6379/2
      FISHAGENT_MINIO_ENDPOINT: http://minio:9000
      FISHAGENT_MINIO_ACCESS_KEY: fishagent
      FISHAGENT_MINIO_SECRET_KEY: fishagent-secret
      FISHAGENT_MINIO_BUCKET: fishagent-evidence
      FISHAGENT_AUTH_ENABLED: ${FISHAGENT_AUTH_ENABLED:-false}
      FISHAGENT_ADMIN_USERNAME: ${FISHAGENT_ADMIN_USERNAME:-admin}
      FISHAGENT_ADMIN_PASSWORD: ${FISHAGENT_ADMIN_PASSWORD:-}
      FISHAGENT_USERS_JSON: ${FISHAGENT_USERS_JSON:-{}}
      FISHAGENT_AUTH_COOKIE_SECURE: ${FISHAGENT_AUTH_COOKIE_SECURE:-false}
      FISHAGENT_LLM_PROVIDER: ${FISHAGENT_LLM_PROVIDER:-zai}
      FISHAGENT_LLM_BASE_URL: ${FISHAGENT_LLM_BASE_URL:-https://api.z.ai/api/paas/v4}
      FISHAGENT_LLM_MODEL: ${FISHAGENT_LLM_MODEL:-glm-4.5}
      FISHAGENT_LLM_API_KEY: ${FISHAGENT_LLM_API_KEY:-}
      FISHAGENT_LLM_ENABLED: ${FISHAGENT_LLM_ENABLED:-false}
      FISHAGENT_MQTT_ENABLED: "true"
      FISHAGENT_MQTT_HOST: mqtt
      FISHAGENT_MQTT_PORT: 1883
    volumes:
      - fishagent-data:/app/data
    ports:
      - "127.0.0.1:3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/.venv/bin/uvicorn", "fishagent.web.app:app", "--host", "0.0.0.0", "--port", "3008"]

  worker-default:
    build: .
    environment: &fishagent-runtime-env
      PYTHONPATH: /app/src
      FISHAGENT_DATABASE_URL: postgresql://fishagent:fishagent@postgres:5432/fishagent
      FISHAGENT_REDIS_URL: redis://redis:6379/0
      FISHAGENT_CELERY_ENABLED: "true"
      FISHAGENT_CELERY_BROKER_URL: redis://redis:6379/1
      FISHAGENT_CELERY_RESULT_BACKEND: redis://redis:6379/2
      FISHAGENT_MINIO_ENDPOINT: http://minio:9000
      FISHAGENT_MINIO_ACCESS_KEY: fishagent
      FISHAGENT_MINIO_SECRET_KEY: fishagent-secret
      FISHAGENT_MINIO_BUCKET: fishagent-evidence
      FISHAGENT_AUTH_ENABLED: ${FISHAGENT_AUTH_ENABLED:-false}
      FISHAGENT_ADMIN_USERNAME: ${FISHAGENT_ADMIN_USERNAME:-admin}
      FISHAGENT_ADMIN_PASSWORD: ${FISHAGENT_ADMIN_PASSWORD:-}
      FISHAGENT_USERS_JSON: ${FISHAGENT_USERS_JSON:-{}}
      FISHAGENT_LLM_PROVIDER: ${FISHAGENT_LLM_PROVIDER:-zai}
      FISHAGENT_LLM_BASE_URL: ${FISHAGENT_LLM_BASE_URL:-https://api.z.ai/api/paas/v4}
      FISHAGENT_LLM_MODEL: ${FISHAGENT_LLM_MODEL:-glm-4.5}
      FISHAGENT_LLM_API_KEY: ${FISHAGENT_LLM_API_KEY:-}
      FISHAGENT_LLM_ENABLED: ${FISHAGENT_LLM_ENABLED:-false}
    volumes:
      - fishagent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/.venv/bin/celery", "-A", "fishagent.infrastructure.queue.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=default", "--concurrency=2"]

  worker-vision:
    build: .
    environment:
      <<: *fishagent-runtime-env
    volumes:
      - fishagent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/.venv/bin/celery", "-A", "fishagent.infrastructure.queue.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=vision", "--concurrency=1"]

  beat:
    build: .
    environment:
      <<: *fishagent-runtime-env
    volumes:
      - fishagent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["/app/.venv/bin/celery", "-A", "fishagent.infrastructure.queue.celery_app:celery_app", "beat", "--loglevel=INFO"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fishagent
      POSTGRES_USER: fishagent
      POSTGRES_PASSWORD: fishagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fishagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishagent -d fishagent"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - fishagent-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: fishagent
      MINIO_ROOT_PASSWORD: fishagent-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - fishagent-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  mqtt:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./deploy/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - fishagent-mqtt:/mosquitto/data
      - fishagent-mqtt-log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  fishagent-data:
  fishagent-postgres:
  fishagent-redis:
  fishagent-minio:
  fishagent-mqtt:
  fishagent-mqtt-log:

[project]
name = "fishagent-next"
version = "0.1.0"
description = "Fishery aquaculture agent system greenfield vertical slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fishagent = "fishagent.cli:main"

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "fishagent-next"
version = "0.1.0"
description = "Fishery aquaculture agent system greenfield vertical slice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23,<26",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "nicegui>=2,<3",
    "paho-mqtt>=2.1,<3",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "redis>=5,<6",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
fishagent = "fishagent.cli:main"

[project.optional-dependencies]
agent = [
    "crewai>=0.86,<1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "mypy>=1.15,<2",
    "playwright>=1.50,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
